# Netlify Build Configuration
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Aumentar timeout das funções serverless (padrão é 10s, máx 26s no plano grátis)
[functions]
  external_node_modules = ["@supabase/supabase-js"]
  node_bundler = "esbuild"

# Timeout máximo para funções pesadas (Sentinela, sync, dispatcher, etc.)
[functions."api/sentinela/scan"]
  timeout = 26

[functions."api/sync"]
  timeout = 26

[functions."api/trafego/sync"]
  timeout = 26

[functions."api/trafego/metrics"]
  timeout = 26

[functions."api/cron/campaign-dispatcher"]
  timeout = 26

[functions."api/v2/upload/criativo"]
  timeout = 26

[functions."api/catalog/sync"]
  timeout = 26

[functions."api/ai-team/create-audiences"]
  timeout = 26

[functions."api/meta/upload"]
  timeout = 26

[functions."api/meta/transcricao"]
  timeout = 26

[functions."api/meta/transcricao/batch"]
  timeout = 26

# SSE: desabilitado como fonte de mensagens (eventBus in-memory não funciona
# em Netlify serverless — processos isolados por request).
# O hook useRealtimeMessages usa Supabase Realtime (WebSocket) como fonte
# primária. SSE mantido apenas como suplementar para typing/status/connection.
# Timeout curto para não desperdiçar budget de execução serverless.
[functions."api/sse"]
  timeout = 26

# ─── Scheduled Functions (Netlify) ───────────────────────────────────────────
# Dispara o motor de campanhas a cada minuto.
# Documentação: https://docs.netlify.com/functions/scheduled-functions/
[scheduled-functions."campaign-dispatcher-cron"]
  schedule = "* * * * *"
  function = "api/cron/campaign-dispatcher"

# Marca mensagens outbound presas em 'pending' há +5 min como 'failed'.
[scheduled-functions."pending-messages-timeout-cron"]
  schedule = "*/5 * * * *"
  function = "api/cron/pending-messages-timeout"

# Time de IAs: análise diária às 08:00 para todos os tenants com Meta configurado.
# Agentes: José (GPT-4o-mini) + Cláudio (Claude Haiku) + Pedro (Perplexity).
[scheduled-functions."ai-team-daily-cron"]
  schedule = "0 8 * * *"
  function = "api/cron/ai-team"

# Redirects and rewrites — NÃO interceptar rotas de API
# O plugin @netlify/plugin-nextjs gerencia todas as rotas do Next.js automaticamente

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Headers para SSE — desabilitar buffering do proxy Netlify
[[headers]]
  for = "/api/sse"
  [headers.values]
    Cache-Control = "no-cache, no-transform"
    X-Accel-Buffering = "no"
    Content-Type = "text/event-stream"
