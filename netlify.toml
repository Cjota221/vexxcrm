# Netlify Build Configuration
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Aumentar timeout das funções serverless (padrão é 10s, máx 26s no plano grátis)
[functions]
  external_node_modules = ["@supabase/supabase-js"]
  node_bundler = "esbuild"

# Timeout máximo para funções pesadas (Sentinela, sync, dispatcher, etc.)
[functions."api/sentinela/scan"]
  timeout = 26

[functions."api/sync"]
  timeout = 26

[functions."api/cron/campaign-dispatcher"]
  timeout = 26

# SSE: timeout máximo permitido pelo Netlify (26s no plano free)
# Em produção no plano pago pode ser até 10min. O hook detecta queda <2s e
# usa apenas Supabase Realtime como fallback.
[functions."api/sse"]
  timeout = 26

# ─── Scheduled Functions (Netlify) ───────────────────────────────────────────
# Dispara o motor de campanhas a cada minuto.
# Documentação: https://docs.netlify.com/functions/scheduled-functions/
[scheduled-functions."campaign-dispatcher-cron"]
  schedule = "* * * * *"
  function = "api/cron/campaign-dispatcher"

# Redirects and rewrites — NÃO interceptar rotas de API
# O plugin @netlify/plugin-nextjs gerencia todas as rotas do Next.js automaticamente

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Headers para SSE — desabilitar buffering do proxy Netlify
[[headers]]
  for = "/api/sse"
  [headers.values]
    Cache-Control = "no-cache, no-transform"
    X-Accel-Buffering = "no"
    Content-Type = "text/event-stream"
