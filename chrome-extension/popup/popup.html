<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>VEXX CRM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 300px; font-family: 'Segoe UI', sans-serif; background: #f7f8fa; }
    .header { background: #1e3a5f; color: white; padding: 16px; text-align: center; }
    .header h1 { font-size: 16px; font-weight: 700; }
    .header p  { font-size: 11px; opacity: 0.6; margin-top: 2px; }
    .body { padding: 16px; }
    .status { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: white; border-radius: 10px; border: 1px solid #e5e7eb; margin-bottom: 12px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #d1d5db; }
    .dot.green  { background: #059669; }
    .dot.yellow { background: #f59e0b; }
    .status-text { font-size: 12px; color: #374151; }
    .btn { display: block; width: 100%; padding: 10px; font-size: 13px; font-weight: 600; border: none; border-radius: 10px; cursor: pointer; text-align: center; margin-bottom: 8px; transition: all 0.15s; }
    .btn-primary   { background: #1e3a5f; color: white; }
    .btn-primary:hover   { background: #2d5a8e; }
    .btn-secondary { background: white; color: #374151; border: 1px solid #e5e7eb; }
    .btn-secondary:hover { background: #f9fafb; }
    .btn-danger    { background: #fee2e2; color: #dc2626; }
    .btn-danger:hover    { background: #fecaca; }
    .divider { height: 1px; background: #f3f4f6; margin: 12px 0; }
    .footer { padding: 12px 16px; text-align: center; font-size: 10px; color: #9ca3af; border-top: 1px solid #f3f4f6; }
  </style>
</head>
<body>
  <div class="header">
    <h1>VEXX CRM</h1>
    <p>Central de Atendimento</p>
  </div>

  <div class="body">
    <div class="status" id="status-bar">
      <div class="dot" id="auth-dot"></div>
      <span class="status-text" id="auth-text">Verificando...</span>
    </div>

    <div class="status" id="wa-status-bar">
      <div class="dot" id="wa-dot"></div>
      <span class="status-text" id="wa-text">Verificando WhatsApp...</span>
    </div>

    <div class="divider"></div>

    <button class="btn btn-primary" id="btn-open-sidebar">
      ⚡ Abrir Sidebar no WhatsApp
    </button>

    <button class="btn btn-secondary" id="btn-open-crm">
      🖥️ Abrir CRM
    </button>

    <div id="btn-logout-wrap" style="display:none">
      <div class="divider"></div>
      <button class="btn btn-danger" id="btn-logout">
        Sair da conta
      </button>
    </div>
  </div>

  <div class="footer">VEXX CRM v1.0.0</div>

  <script src="popup.js"></script>
</body>
</html>
