<!DOCTYPE html>
<html>
<head><title>Gerar Ícones VEXX CRM</title></head>
<body style="font-family:sans-serif;padding:20px;background:#f0f4f8">
<h2>🎨 Gerador de Ícones — VEXX CRM Extension</h2>
<p>Clique em cada botão para baixar o ícone. Salve na pasta <code>chrome-extension/icons/</code></p>

<div id="canvases"></div>
<br>
<div id="buttons"></div>

<script>
const sizes = [16, 48, 128];

sizes.forEach(size => {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  // Fundo azul royal com bordas arredondadas
  const r = size * 0.18;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fillStyle = '#1e3a5f';
  ctx.fill();

  // Letra V branca
  ctx.fillStyle = '#ffffff';
  ctx.font = `bold ${Math.round(size * 0.62)}px Arial, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('V', size / 2, size / 2 + size * 0.03);

  // Mostrar preview (ampliado)
  const preview = document.createElement('canvas');
  const previewSize = Math.max(size, 64);
  preview.width = previewSize;
  preview.height = previewSize;
  preview.style.margin = '10px';
  preview.style.border = '1px solid #ccc';
  const pctx = preview.getContext('2d');
  pctx.drawImage(canvas, 0, 0, previewSize, previewSize);
  document.getElementById('canvases').appendChild(preview);

  // Botão de download
  const btn = document.createElement('a');
  btn.style = 'display:inline-block;margin:5px;padding:10px 16px;background:#1e3a5f;color:#fff;border-radius:8px;text-decoration:none;font-size:14px;cursor:pointer';
  btn.textContent = `⬇ Baixar icon${size}.png`;
  btn.download = `icon${size}.png`;
  btn.href = canvas.toDataURL('image/png');
  document.getElementById('buttons').appendChild(btn);
});
</script>
</body>
</html>
